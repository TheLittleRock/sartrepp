title: "Analysis of J/ψ Photoproduction in p+p Collisions at √s = 510 GeV with Sartre"
author: "Štěpán Skalka"

repository:
  url: "https://github.com/TheLittleRock/sartrepp"
  path_to_book: "book"
  branch: "main"

execute:
  execute_notebooks: "off"  # Pre-executed with nbconvert

html:
  favicon: "_static/favicon.png"
  use_repository_button: true
  use_issues_button: true
  extra_navbar: |
    <div style="font-size: 0.85em; padding: 10px; color: #8fa5b5;">
      <b>Master Thesis Project</b><br>
      Author: <b>Štěpán Skalka</b><br>
      CTU in Prague & STAR Experiment<br>
      Sartre 2 UPC Event Generator
    </div>

sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  config:
    html_context:
      default_mode: "dark"
    html_theme_options:
      repository_url: "https://github.com/TheLittleRock/sartrepp"
      repository_branch: "main"
      path_to_docs: "book"
      use_repository_button: true
      use_issues_button: false
      use_download_button: true
      use_fullscreen_button: true
      home_page_in_toc: false
    html_static_path: ["_static"]
    html_extra_path: ["extra"]
    html_css_files:
      - custom.css
    html_js_files:
      - mobile-nav.js
      - custom.js

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - smartquotes
    - substitution
    - tasklist
